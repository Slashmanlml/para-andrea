<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tito & Andrea ✨</title>
  <style>
    :root {
      --primary: #ff2a55;
      --dark: #16101c;
      --card-bg: #ffffff;
      --border-color: #221526;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Arial Rounded MT Bold', 'Comfortaa', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0f0914;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      height: 100dvh;
      max-height: 920px;
      background: #7ecba1;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
      border: 4px solid var(--border-color);
    }

    @media (min-width: 481px) {
      #game-container {
        border-radius: 32px;
        height: 94vh;
      }
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* HUD Superior Ultra Limpio */
    .top-hud {
      position: absolute;
      top: max(14px, env(safe-area-inset-top, 14px));
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      pointer-events: none;
    }

    .counter-badge {
      background: #ffffff;
      border: 3.5px solid var(--border-color);
      padding: 6px 16px;
      border-radius: 50px;
      font-weight: 900;
      font-size: clamp(0.9rem, 3.2vw, 1.1rem);
      color: var(--primary);
      box-shadow: 0 4px 0 var(--border-color);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .audio-btn {
      pointer-events: auto;
      background: #ffffff;
      border: 3.5px solid var(--border-color);
      border-radius: 50%;
      width: clamp(42px, 11vw, 48px);
      height: clamp(42px, 11vw, 48px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--border-color);
      transition: transform 0.1s;
    }

    .audio-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--border-color);
    }

    /* Controles D-Pad */
    .controls-wrapper {
      position: absolute;
      bottom: max(14px, env(safe-area-inset-bottom, 14px));
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 30;
      pointer-events: none;
    }

    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, clamp(54px, 15vw, 68px));
      grid-template-rows: repeat(2, clamp(44px, 12vw, 54px));
      gap: 6px;
      pointer-events: auto;
    }

    .dpad-btn {
      background: #ffffff;
      border: 3.5px solid var(--border-color);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.3rem, 4vw, 1.6rem);
      font-weight: 900;
      color: var(--primary);
      box-shadow: 0 5px 0 var(--border-color);
      cursor: pointer;
      user-select: none;
      transition: all 0.08s;
    }

    .dpad-btn:active, .dpad-btn.active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--border-color);
      background: var(--primary);
      color: #ffffff;
    }

    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }

    /* Modal Inicio Simple */
    .start-screen {
      position: absolute;
      inset: 0;
      background: rgba(15, 9, 20, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
      transition: opacity 0.3s ease;
    }

    .start-btn {
      background: var(--primary);
      color: white;
      border: 4px solid var(--border-color);
      border-radius: 50px;
      padding: 16px 36px;
      font-size: 1.25rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 0 var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: pulseBtn 1.5s infinite;
    }

    .start-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 var(--border-color);
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Modal Final Limpio */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 9, 20, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      border: 4.5px solid var(--border-color);
      border-radius: 32px;
      padding: clamp(24px, 6vw, 32px) clamp(18px, 5vw, 24px);
      width: 100%;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 10px 0 var(--border-color);
      transform: scale(0.88);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.4);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-card h2 {
      font-size: clamp(1.3rem, 4.8vw, 1.6rem);
      font-weight: 900;
      color: var(--dark);
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .proposal-area {
      position: relative;
      height: 100px;
      width: 100%;
      margin-top: 10px;
    }

    #btn-yes {
      position: absolute;
      left: 8px;
      top: 20px;
      width: 130px;
      z-index: 10;
      background: #2ec4b6;
      color: #ffffff;
      border: 3.5px solid var(--border-color);
      padding: 12px 18px;
      border-radius: 50px;
      font-weight: 900;
      font-size: 1.05rem;
      box-shadow: 0 5px 0 var(--border-color);
      cursor: pointer;
    }

    #btn-no {
      position: absolute;
      right: 8px;
      top: 20px;
      width: 130px;
      background: #ff9f1c;
      color: #ffffff;
      border: 3.5px solid var(--border-color);
      padding: 12px 18px;
      border-radius: 50px;
      font-weight: 900;
      font-size: 1rem;
      box-shadow: 0 5px 0 var(--border-color);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-yes:active, .btn-no:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--border-color);
    }

    .whatsapp-btn {
      background: #25d366 !important;
      color: white;
      border: 3.5px solid var(--border-color);
      padding: 14px;
      border-radius: 50px;
      font-weight: 900;
      font-size: 1.05rem;
      width: 100%;
      box-shadow: 0 6px 0 var(--border-color);
      cursor: pointer;
      margin-top: 8px;
    }

    .whatsapp-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--border-color);
    }
  </style>
</head>
<body>

  <div id="game-container">
    
    <!-- HUD Superior -->
    <div class="top-hud">
      <div class="counter-badge">
        <span>💐</span>
        <span id="rose-score">0 / 5</span>
      </div>
      <button class="audio-btn" id="audioToggle" onclick="toggleAudio()">🎵</button>
    </div>

    <!-- Canvas Principal -->
    <canvas id="gameCanvas"></canvas>

    <!-- Controles táctiles -->
    <div class="controls-wrapper">
      <div class="dpad-container">
        <button class="dpad-btn btn-up" id="btnUp">▲</button>
        <button class="dpad-btn btn-left" id="btnLeft">◀</button>
        <button class="dpad-btn btn-down" id="btnDown">▼</button>
        <button class="dpad-btn btn-right" id="btnRight">▶</button>
      </div>
    </div>

    <!-- Pantalla de Inicio Limpia (1 solo botón) -->
    <div class="start-screen" id="startScreen">
      <button class="start-btn" onclick="startGame()">
        <span>JUGAR</span> 💖
      </button>
    </div>

    <!-- MODAL FINAL (Sin párrafos largos, solo la pregunta) -->
    <div class="modal-overlay" id="modal-final">
      <div class="modal-card">
        <div style="font-size: 3.5rem; margin-bottom: 8px;">👑💐💋</div>
        <h2 id="final-question">¿Aceptas tener una cita conmigo? 🥰</h2>

        <div class="proposal-buttons" id="proposalArea">
          <button id="btn-yes" onclick="celebrateYes()">¡SÍ! 💖</button>
          <button id="btn-no" onmouseover="dodgeNo()" ontouchstart="dodgeNo()" onclick="dodgeNo()">No 😜</button>
        </div>

        <button class="whatsapp-btn" id="btnWhatsApp" style="display: none;" onclick="openWhatsApp()">
          Confirmar por WhatsApp 💬
        </button>
      </div>
    </div>

  </div>

  <script>
    /* =========================================================================
       CONFIGURACIÓN LIMPIA
       ========================================================================= */
    const CONFIG = {
      nombreChico: "Tito",
      nombreChica: "Andrea",
      telefonoWhatsApp: "5493765005973", // Número de Tito (+54 9 3765 005973)
      mensajeWhatsApp: "¡Hola Tito! Jugué a nuestro juego, amé el besito y las rosas... ¡Acepto la cita! 🥰💐✨",
      rosas: [
        { color: "#ff1744" }, // Rojo pasión
        { color: "#ff4081" }, // Rosa intenso
        { color: "#ffd600" }, // Amarillo oro
        { color: "#ffffff" }, // Blanco puro
        { color: "#aa00ff" }  // Púrpura mágico
      ],
      frasesNo: [
        "¿Segura? 👀",
        "¡Casi! 😜",
        "¡Bloqueado! 💖",
        "¡Por acá no! 🌹",
        "¡Piénsalo! 🥰",
        "¡Toca el verde! ✨"
      ]
    };

    /* =========================================================================
       AUDIO SINTETIZADO PUCCA
       ========================================================================= */
    let audioCtx = null;
    let musicPlaying = false;
    let musicInterval = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type, duration, delay = 0, vol = 0.08) {
      if (!audioCtx) return;
      setTimeout(() => {
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(vol, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
      }, delay);
    }

    function playDashSound() {
      if (!audioCtx) return;
      playTone(400, 'triangle', 0.08, 0, 0.05);
      playTone(600, 'triangle', 0.08, 30, 0.05);
    }

    function playRoseChime() {
      if (!audioCtx) return;
      playTone(659.25, 'sine', 0.12, 0);
      playTone(783.99, 'sine', 0.12, 50);
      playTone(1046.50, 'sine', 0.25, 100);
    }

    function playKissSound() {
      if (!audioCtx) return;
      playTone(520, 'sine', 0.06, 0, 0.12);
      playTone(880, 'sine', 0.1, 40, 0.14);
      playTone(1400, 'triangle', 0.3, 90, 0.16);
    }

    function startMusic() {
      if (!audioCtx) initAudio();
      musicPlaying = true;
      document.getElementById('audioToggle').innerText = '🔊';

      const melody = [
        523.25, 587.33, 659.25, 783.99, 880, 783.99, 659.25, 587.33,
        523.25, 659.25, 783.99, 1046.5, 880, 783.99, 659.25, 523.25
      ];
      let step = 0;
      if (musicInterval) clearInterval(musicInterval);
      musicInterval = setInterval(() => {
        if (!musicPlaying) return;
        playTone(melody[step], 'triangle', 0.2, 0, 0.035);
        step = (step + 1) % melody.length;
      }, 230);
    }

    function toggleAudio() {
      initAudio();
      musicPlaying = !musicPlaying;
      if (musicPlaying) {
        startMusic();
      } else {
        clearInterval(musicInterval);
        document.getElementById('audioToggle').innerText = '🔇';
      }
    }

    /* =========================================================================
       MOTOR DEL JUEGO
       ========================================================================= */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const V_WIDTH = 440;
    const WORLD_WIDTH = 440;
    const WORLD_HEIGHT = 2600;
    const PATH_X = WORLD_WIDTH / 2;
    const PATH_WIDTH = 140;

    let gameState = 'START';
    let collectedCount = 0;
    let cameraY = WORLD_HEIGHT - 650;
    let currentScale = 1;

    // Tito (Con mullet de rulos negros real, degradé lateral, sombra de barba definida, cadenita)
    const tito = {
      x: PATH_X,
      y: WORLD_HEIGHT - 120,
      w: 48,
      h: 56,
      speed: 5.4,
      runFrame: 0,
      squash: 1,
      stretch: 1,
      facing: 1,
      heartEyesTimer: 0,
      intenseLove: false,
      spinAngle: 0
    };

    // Andrea (Con rulos largos, trencitas en la corona, crop top blanco, pollera de jean)
    const andrea = {
      x: PATH_X,
      y: 110,
      w: 50,
      h: 56,
      jumpY: 0,
      kissOffset: 0
    };

    // Rosas colocadas A LOS COSTADOS
    const roses = [
      { id: 0, x: PATH_X - 110, y: WORLD_HEIGHT - 450, side: 'left', collected: false },
      { id: 1, x: PATH_X + 110, y: WORLD_HEIGHT - 900, side: 'right', collected: false },
      { id: 2, x: PATH_X - 110, y: WORLD_HEIGHT - 1350, side: 'left', collected: false },
      { id: 3, x: PATH_X + 110, y: WORLD_HEIGHT - 1800, side: 'right', collected: false },
      { id: 4, x: PATH_X + 110, y: WORLD_HEIGHT - 2250, side: 'right', collected: false }
    ];

    const dustPuffs = [];
    const headHearts = [];
    const kissTornado = [];

    // Flores de fondo
    const scenery = [];
    for (let y = 100; y < WORLD_HEIGHT - 50; y += 110) {
      scenery.push({
        x: PATH_X - 160 + (Math.random() * 20),
        y: y + (Math.random() * 30),
        r: 22 + Math.random() * 8,
        color: '#ff70a6'
      });
      scenery.push({
        x: PATH_X + 160 - (Math.random() * 20),
        y: y + 55 + (Math.random() * 30),
        r: 22 + Math.random() * 8,
        color: '#ff4d6d'
      });
    }

    function resizeCanvas() {
      const container = document.getElementById('game-container');
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = container.clientWidth;
      const height = container.clientHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      currentScale = (width / V_WIDTH) * dpr;
    }
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 150));
    resizeCanvas();

    /* =========================================================================
       SPRITES DETALLADOS Y REALISTAS (TITO CON MULLET & BARBA, ANDREA CON TRENCITAS)
       ========================================================================= */

    // DIBUJAR A TITO (Mullet de rulos negros realista, degradé a los lados, sombra de barba nítida, cadenita de oro)
    function drawDetailedTito(ctx, p) {
      ctx.save();
      ctx.translate(p.x, p.y);

      if (p.intenseLove) {
        ctx.rotate(p.spinAngle);
      }

      ctx.scale(p.facing * p.stretch, p.squash);

      // Sombra
      ctx.fillStyle = "rgba(18, 12, 22, 0.25)";
      ctx.beginPath();
      ctx.ellipse(0, 23, 16, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      // Zapatillas blancas
      const isMoving = (keys.up || keys.down || keys.left || keys.right);
      const runAngle = isMoving ? Math.sin(p.runFrame * 0.4) * 8 : 0;

      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#1b1420";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(-8, 18 + runAngle, 5.5, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.arc(8, 18 - runAngle, 5.5, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      // Pantalón oscuro
      ctx.fillStyle = "#1b1420";
      ctx.fillRect(-10, 8, 20, 11);

      // Remera negra
      ctx.fillStyle = "#151515";
      ctx.strokeStyle = "#1b1420";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.roundRect(-13, -7, 26, 17, 5);
      ctx.fill(); ctx.stroke();

      // CADENITA DE ORO BRILLANTE ✨
      ctx.strokeStyle = "#ffd700";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(0, -6, 6, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.stroke();

      // Ramo de rosas en la mano
      if (collectedCount > 0) {
        drawDetailedRoseSprite(ctx, 14, -2, 7, "#ff1744");
      }

      // Cuello
      ctx.fillStyle = "#fcd5b5";
      ctx.fillRect(-4, -10, 8, 5);

      // 1. MULLET TRASERO (Rulos largos cayendo por detrás del cuello como en la foto)
      ctx.fillStyle = "#120c16";
      ctx.strokeStyle = "#1b1420";
      ctx.lineWidth = 2.5;

      const backMulletCurls = [
        { dx: -13, dy: -4, r: 6.5 },
        { dx: 13, dy: -4, r: 6.5 },
        { dx: -11, dy: 3, r: 6 },
        { dx: 11, dy: 3, r: 6 },
        { dx: -7, dy: 9, r: 5.5 },
        { dx: 7, dy: 9, r: 5.5 },
        { dx: -2, dy: 11, r: 5 },
        { dx: 2, dy: 11, r: 5 }
      ];
      backMulletCurls.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.dx, -18 + c.dy, c.r, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      });

      // 2. Cabeza
      ctx.fillStyle = "#fcd5b5";
      ctx.strokeStyle = "#1b1420";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(0, -18, 14, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      // 3. SOMBRA DE BARBA DEFINIDA (Stubble en mandíbula y mentón como en la foto)
      ctx.fillStyle = "rgba(40, 25, 30, 0.22)";
      ctx.beginPath();
      ctx.arc(0, -15, 12, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.fill();

      // 4. DEGRADÉ LATERAL CORTO (Fade en los costados de la cabeza)
      ctx.fillStyle = "rgba(18, 12, 22, 0.45)";
      ctx.beginPath();
      ctx.arc(-10, -19, 5, 0, Math.PI * 2);
      ctx.arc(10, -19, 5, 0, Math.PI * 2);
      ctx.fill();

      // 5. RULOS FRONTALES Y SUPERIORES DEFINIDOS
      ctx.fillStyle = "#120c16";
      const topMulletCurls = [
        { dx: -11, dy: -14, r: 7 },
        { dx: -4, dy: -18, r: 7.5 },
        { dx: 4, dy: -18, r: 7.5 },
        { dx: 11, dy: -14, r: 7 },
        { dx: -6, dy: -11, r: 5.5 }, // rulos que caen en la frente
        { dx: 0, dy: -12, r: 6 },
        { dx: 6, dy: -11, r: 5.5 }
      ];
      topMulletCurls.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.dx, -18 + c.dy, c.r, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      });

      // 6. OJOS Y EXPRESIÓN
      if (p.heartEyesTimer > 0 || p.intenseLove) {
        const pulse = 1 + Math.sin(Date.now() * 0.02) * 0.25;
        ctx.fillStyle = "#ff1744";
        ctx.strokeStyle = "#1b1420";
        ctx.lineWidth = 2;
        drawDetailedHeart(ctx, -5, -18, 6.5 * pulse);
        drawDetailedHeart(ctx, 5, -18, 6.5 * pulse);

        // Sonrisa gigante
        ctx.fillStyle = "#ff1744";
        ctx.beginPath();
        ctx.arc(0, -12, 4.5, 0, Math.PI);
        ctx.fill(); ctx.stroke();

        // Chapitas
        ctx.fillStyle = "#ff4081";
        ctx.beginPath();
        ctx.ellipse(-8, -13, 3.5, 2, 0, 0, Math.PI * 2);
        ctx.ellipse(8, -13, 3.5, 2, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Ojos cálidos y definidos
        ctx.fillStyle = "#1b1420";
        ctx.beginPath();
        ctx.arc(-4.5, -18, 2.4, 0, Math.PI * 2);
        ctx.arc(4.5, -18, 2.4, 0, Math.PI * 2);
        ctx.fill();

        // Brillo blanco en los ojos
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(-3.5, -19, 1, 0, Math.PI * 2);
        ctx.arc(5.5, -19, 1, 0, Math.PI * 2);
        ctx.fill();

        // Sonrisa tierna
        ctx.strokeStyle = "#b3543b";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(0, -13, 3.5, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.stroke();

        // Sonrojo
        ctx.fillStyle = "rgba(255, 64, 129, 0.4)";
        ctx.beginPath();
        ctx.arc(-7, -14, 2.5, 0, Math.PI * 2);
        ctx.arc(7, -14, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    // DIBUJAR A ANDREA (Rulos largos negros con trencitas en la corona, crop top blanco, pollera jean)
    function drawDetailedAndrea(ctx, p) {
      ctx.save();
      ctx.translate(p.x, p.y + p.kissOffset - p.jumpY);

      // Sombra
      ctx.fillStyle = "rgba(18, 12, 22, 0.25)";
      ctx.beginPath();
      ctx.ellipse(0, 23 + p.jumpY, 18, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Piernitas
      ctx.fillStyle = "#fcd5b5";
      ctx.strokeStyle = "#1b1420";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(-7, 18, 5, 0, Math.PI * 2);
      ctx.arc(7, 18, 5, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      // POLLERA DE JEAN CELESTE (Con detalle de bolsillos)
      ctx.fillStyle = "#7cb9e8";
      ctx.strokeStyle = "#1b1420";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(-11, 2);
      ctx.lineTo(11, 2);
      ctx.lineTo(15, 14);
      ctx.lineTo(-15, 14);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // CROP TOP BLANCO
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#1b1420";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.roundRect(-10, -8, 20, 11, 4);
      ctx.fill(); ctx.stroke();

      // Vasito térmico rosa en mano 🥤
      ctx.fillStyle = "#ff4081";
      ctx.strokeStyle = "#1b1420";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(11, -5, 6, 11, 2);
      ctx.fill(); ctx.stroke();

      // 1. RULOS LARGOS DE ANDREA (Cayendo por los hombros y espalda)
      ctx.fillStyle = "#120c16";
      ctx.strokeStyle = "#1b1420";
      ctx.lineWidth = 2.5;

      const andreaLongCurls = [
        { dx: -15, dy: -7, r: 7.5 },
        { dx: 15, dy: -7, r: 7.5 },
        { dx: -17, dy: 1, r: 8 },
        { dx: 17, dy: 1, r: 8 },
        { dx: -16, dy: 9, r: 7.5 },
        { dx: 16, dy: 9, r: 7.5 },
        { dx: -13, dy: 17, r: 6.5 },
        { dx: 13, dy: 17, r: 6.5 },
        { dx: -10, dy: 23, r: 5.5 },
        { dx: 10, dy: 23, r: 5.5 }
      ];
      andreaLongCurls.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.dx, -18 + c.dy, c.r, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      });

      // 2. Cabeza
      ctx.fillStyle = "#fcd5b5";
      ctx.strokeStyle = "#1b1420";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(0, -18, 15, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      // 3. PARTE SUPERIOR CON TRENCITAS / SECCIONES (El peinado exacto de Andrea en la foto)
      ctx.fillStyle = "#120c16";
      ctx.beginPath();
      ctx.arc(0, -25, 9, Math.PI, 0);
      ctx.fill(); ctx.stroke();

      // Líneas de las trencitas hacia atrás
      ctx.strokeStyle = "#38293d";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-5, -29); ctx.lineTo(-3, -22);
      ctx.moveTo(0, -30);  ctx.lineTo(0, -22);
      ctx.moveTo(5, -29);  ctx.lineTo(3, -22);
      ctx.stroke();

      // 4. OJOS Y SONRISA CON HOYUELOS
      ctx.strokeStyle = "#1b1420";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(-5, -18, 3.2, 0.8 * Math.PI, 0.2 * Math.PI, true);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(5, -18, 3.2, 0.8 * Math.PI, 0.2 * Math.PI, true);
      ctx.stroke();

      // Sonrisa dulce
      ctx.beginPath();
      ctx.arc(0, -12, 4, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.stroke();

      // Hoyuelos & Chapitas rojas
      ctx.fillStyle = "#ff4081";
      ctx.beginPath();
      ctx.ellipse(-9, -13, 4, 2.5, 0, 0, Math.PI * 2);
      ctx.ellipse(9, -13, 4, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Corazón flotando
      const heartBounce = Math.sin(Date.now() * 0.008) * 5;
      drawDetailedHeart(ctx, 0, -46 + heartBounce, 8);

      ctx.restore();
    }

    // DIBUJAR ROSAS REALES CON PÉTALOS EN CAPAS Y TALLO CON HOJAS BOTÁNICAS
    function drawDetailedRoseSprite(ctx, rx, ry, size, color) {
      ctx.save();
      ctx.translate(rx, ry);

      // Tallo verde con hojas
      ctx.fillStyle = "#2e7d32";
      ctx.strokeStyle = "#1b1420";
      ctx.lineWidth = 2;
      ctx.fillRect(-1.5, size * 0.4, 3, size * 1.3);
      ctx.strokeRect(-1.5, size * 0.4, 3, size * 1.3);

      // Hoja derecha
      ctx.beginPath();
      ctx.ellipse(size * 0.7, size * 0.8, size * 0.45, size * 0.25, 0.3, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      // Hoja izquierda
      ctx.beginPath();
      ctx.ellipse(-size * 0.7, size * 1.0, size * 0.45, size * 0.25, -0.3, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      // Pétalos exteriores de la rosa
      ctx.fillStyle = color;
      ctx.lineWidth = 2.5;

      // Capa base
      ctx.beginPath();
      ctx.arc(0, 0, size, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      // Capa de pétalos superpuestos (Rosa abierta)
      ctx.fillStyle = "rgba(0, 0, 0, 0.12)";
      ctx.beginPath();
      ctx.arc(-size * 0.25, -size * 0.1, size * 0.6, 0.2 * Math.PI, 1.4 * Math.PI);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(size * 0.25, size * 0.1, size * 0.6, 1.1 * Math.PI, 0.1 * Math.PI);
      ctx.stroke();

      // Espiral central del capullo
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.45, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, -size * 0.05, size * 0.25, 0.2 * Math.PI, 1.8 * Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    function drawDetailedHeart(ctx, hx, hy, size) {
      ctx.save();
      ctx.translate(hx, hy);
      ctx.fillStyle = "#ff1744";
      ctx.strokeStyle = "#1b1420";
      ctx.lineWidth = 2.2;

      ctx.beginPath();
      const d = size;
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-d / 2, -d / 2, -d, d / 3, 0, d);
      ctx.bezierCurveTo(d, d / 3, d / 2, -d / 2, 0, 0);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // Dibujar Rosa en el mapa del sendero
    function drawMapRose(ctx, r) {
      if (r.collected) return;

      const float = Math.sin(Date.now() * 0.006 + r.id) * 5;
      const rx = r.x;
      const ry = r.y + float;

      ctx.save();
      // Cantero
      ctx.fillStyle = "#ffe4e8";
      ctx.strokeStyle = "#1b1420";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(rx, r.y + 16, 20, 9, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      // Dibujar la rosa detallada
      const info = CONFIG.rosas[r.id];
      drawDetailedRoseSprite(ctx, rx, ry, 13, info.color);

      ctx.restore();
    }

    /* =========================================================================
       ACTUALIZACIÓN Y FÍSICAS
       ========================================================================= */
    const keys = { up: false, down: false, left: false, right: false };

    function update() {
      if (gameState === 'PLAYING') {
        let dx = 0;
        let dy = 0;

        if (keys.up) dy -= 1;
        if (keys.down) dy += 1;
        if (keys.left) { dx -= 1; tito.facing = -1; }
        if (keys.right) { dx += 1; tito.facing = 1; }

        if (dx !== 0 && dy !== 0) {
          dx *= 0.7071;
          dy *= 0.7071;
        }

        const isRunning = (dx !== 0 || dy !== 0);

        if (isRunning) {
          tito.runFrame++;
          tito.squash = 1 + Math.sin(tito.runFrame * 0.4) * 0.12;
          tito.stretch = 1 - Math.sin(tito.runFrame * 0.4) * 0.1;

          if (tito.runFrame % 5 === 0) {
            dustPuffs.push({
              x: tito.x - (tito.facing * 10),
              y: tito.y + 16,
              r: 6 + Math.random() * 4,
              alpha: 1
            });
            playDashSound();
          }
        } else {
          tito.squash = 1;
          tito.stretch = 1;
        }

        tito.x += dx * tito.speed;
        tito.y += dy * tito.speed;

        tito.x = Math.max(35, Math.min(WORLD_WIDTH - 35, tito.x));
        tito.y = Math.max(andrea.y + 40, Math.min(WORLD_HEIGHT - 50, tito.y));

        if (tito.heartEyesTimer > 0) tito.heartEyesTimer--;

        // Recolección de rosas
        roses.forEach(r => {
          if (!r.collected) {
            const dist = Math.hypot(tito.x - r.x, tito.y - r.y);
            if (dist < 40) {
              r.collected = true;
              collectedCount++;
              document.getElementById('rose-score').innerText = `${collectedCount} / 5`;
              playRoseChime();
              if (navigator.vibrate) navigator.vibrate(50);

              tito.heartEyesTimer = 160;

              for (let i = 0; i < 14; i++) {
                headHearts.push({
                  x: tito.x + (Math.random() - 0.5) * 20,
                  y: tito.y - 35,
                  vx: (Math.random() - 0.5) * 4,
                  vy: -Math.random() * 3 - 2,
                  size: Math.random() * 6 + 5,
                  alpha: 1
                });
              }
            }
          }
        });

        // Encuentro con Andrea
        const distAndrea = Math.hypot(tito.x - andrea.x, tito.y - andrea.y);
        if (distAndrea < 70) {
          if (collectedCount >= 5) {
            startKissScene();
          }
        }

        // Cámara
        const viewportVirtualHeight = canvas.height / currentScale;
        const targetCamY = tito.y - (viewportVirtualHeight * 0.65);
        cameraY += (targetCamY - cameraY) * 0.12;
        cameraY = Math.max(0, Math.min(WORLD_HEIGHT - viewportVirtualHeight, cameraY));
      }

      // Cinemática del Beso
      if (gameState === 'KISS_SCENE') {
        kissTimer++;

        if (kissTimer < 25) {
          andrea.jumpY = Math.sin((kissTimer / 25) * Math.PI) * 24;
          andrea.kissOffset = (kissTimer / 25) * 18;
        } else if (kissTimer === 25) {
          playKissSound();
          if (navigator.vibrate) navigator.vibrate([100, 50, 200]);

          for (let i = 0; i < 80; i++) {
            kissTornado.push({
              x: tito.x,
              y: tito.y - 15,
              angle: Math.random() * Math.PI * 2,
              dist: Math.random() * 10,
              speed: Math.random() * 5 + 3,
              size: Math.random() * 8 + 6,
              alpha: 1
            });
          }
        } else if (kissTimer > 25 && kissTimer < 90) {
          tito.intenseLove = true;
          tito.spinAngle += 0.2;
          tito.y -= 0.6;
        } else if (kissTimer >= 120) {
          triggerFinalModal();
        }
      }

      // Partículas
      dustPuffs.forEach((d, idx) => {
        d.r += 0.4;
        d.alpha -= 0.05;
        if (d.alpha <= 0) dustPuffs.splice(idx, 1);
      });

      headHearts.forEach((h, idx) => {
        h.x += h.vx;
        h.y += h.vy;
        h.vy += 0.06;
        h.alpha -= 0.02;
        if (h.alpha <= 0) headHearts.splice(idx, 1);
      });

      kissTornado.forEach((k, idx) => {
        k.dist += k.speed;
        k.angle += 0.1;
        k.alpha -= 0.015;
        if (k.alpha <= 0) kissTornado.splice(idx, 1);
      });
    }

    let kissTimer = 0;
    function startKissScene() {
      gameState = 'KISS_SCENE';
      kissTimer = 0;
      keys.up = false; keys.down = false; keys.left = false; keys.right = false;
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.scale(currentScale, currentScale);
      ctx.translate(0, -cameraY);

      // Césped
      ctx.fillStyle = "#7ecba1";
      ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

      // Sendero
      ctx.fillStyle = "#ffe4e8";
      ctx.strokeStyle = "#1b1420";
      ctx.lineWidth = 4;
      ctx.fillRect(PATH_X - (PATH_WIDTH / 2), 0, PATH_WIDTH, WORLD_HEIGHT);
      ctx.strokeRect(PATH_X - (PATH_WIDTH / 2), 0, PATH_WIDTH, WORLD_HEIGHT);

      // Adoquines
      for (let y = 30; y < WORLD_HEIGHT; y += 70) {
        ctx.fillStyle = "#ffccd5";
        ctx.beginPath();
        ctx.roundRect(PATH_X - 35, y, 70, 24, 12);
        ctx.fill(); ctx.stroke();
      }

      // Senderos pequeños a las rosas
      roses.forEach(r => {
        ctx.fillStyle = "#ffe4e8";
        ctx.lineWidth = 3.5;
        if (r.side === 'left') {
          ctx.fillRect(r.x, r.y + 4, (PATH_X - (PATH_WIDTH / 2)) - r.x + 8, 16);
          ctx.strokeRect(r.x, r.y + 4, (PATH_X - (PATH_WIDTH / 2)) - r.x + 8, 16);
        } else {
          ctx.fillRect(PATH_X + (PATH_WIDTH / 2) - 8, r.y + 4, r.x - (PATH_X + (PATH_WIDTH / 2)) + 8, 16);
          ctx.strokeRect(PATH_X + (PATH_WIDTH / 2) - 8, r.y + 4, r.x - (PATH_X + (PATH_WIDTH / 2)) + 8, 16);
        }
      });

      // Flores decorativas
      scenery.forEach(s => {
        ctx.fillStyle = s.color;
        ctx.strokeStyle = "#1b1420";
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#ffd600";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 0.35, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      });

      // Polvo al correr
      dustPuffs.forEach(d => {
        ctx.save();
        ctx.globalAlpha = d.alpha;
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#1b1420";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.restore();
      });

      // Rosas en el mapa
      roses.forEach(r => drawMapRose(ctx, r));

      // Andrea detallada
      drawDetailedAndrea(ctx, andrea);

      // Tito detallado
      drawDetailedTito(ctx, tito);

      // Corazones sobre la cabeza
      headHearts.forEach(h => {
        ctx.save();
        ctx.globalAlpha = h.alpha;
        drawDetailedHeart(ctx, h.x, h.y, h.size);
        ctx.restore();
      });

      // Beso cómic animado
      if (gameState === 'KISS_SCENE' && kissTimer >= 25 && kissTimer < 100) {
        ctx.save();
        ctx.font = "900 22px 'Arial Rounded MT Bold', sans-serif";
        ctx.fillStyle = "#ff1744";
        ctx.strokeStyle = "#1b1420";
        ctx.lineWidth = 5;
        ctx.textAlign = "center";
        ctx.strokeText("💋 ¡MUACK! 💖", tito.x, tito.y - 65);
        ctx.fillText("💋 ¡MUACK! 💖", tito.x, tito.y - 65);
        ctx.restore();
      }

      // Tornado de corazones
      kissTornado.forEach(k => {
        ctx.save();
        ctx.globalAlpha = k.alpha;
        const kx = tito.x + Math.cos(k.angle) * k.dist;
        const ky = tito.y - 15 + Math.sin(k.angle) * k.dist;
        drawDetailedHeart(ctx, kx, ky, k.size);
        ctx.restore();
      });

      ctx.restore();
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    /* =========================================================================
       INICIO Y EVENTOS
       ========================================================================= */
    function startGame() {
      initAudio();
      startMusic();
      document.getElementById('startScreen').style.display = 'none';
      gameState = 'PLAYING';
      gameLoop();
    }

    function triggerFinalModal() {
      gameState = 'FINAL';
      if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 250]);
      document.getElementById('modal-final').classList.add('active');
    }

    let noCount = 0;
    function dodgeNo(e) {
      if (e) e.preventDefault();
      noCount++;
      const btnNo = document.getElementById('btn-no');
      const btnYes = document.getElementById('btn-yes');
      const area = document.getElementById('proposalArea');

      btnNo.innerText = CONFIG.frasesNo[noCount % CONFIG.frasesNo.length];

      const maxX = area.clientWidth - 130;
      const maxY = area.clientHeight - 45;
      const randX = Math.floor(Math.random() * maxX);
      const randY = Math.floor(Math.random() * maxY);

      btnNo.style.position = 'absolute';
      btnNo.style.left = `${randX}px`;
      btnNo.style.top = `${randY}px`;

      btnYes.style.transform = `scale(${1 + (noCount * 0.08)})`;
      if (navigator.vibrate) navigator.vibrate(30);
    }

    function celebrateYes() {
      playKissSound();
      if (navigator.vibrate) navigator.vibrate([150, 50, 150, 50, 300]);
      document.getElementById('final-question').innerHTML = "🎉 ¡SABÍA QUE DIRÍAS QUE SÍ! 🥰💐";
      document.getElementById('proposalArea').style.display = 'none';
      document.getElementById('btnWhatsApp').style.display = 'block';
    }

    function openWhatsApp() {
      const url = `https://wa.me/${CONFIG.telefonoWhatsApp}?text=${encodeURIComponent(CONFIG.mensajeWhatsApp)}`;
      window.open(url, '_blank');
    }

    /* =========================================================================
       CONTROLES
       ========================================================================= */
    function bindBtn(id, key) {
      const el = document.getElementById(id);
      const start = (e) => {
        e.preventDefault();
        initAudio();
        keys[key] = true;
        el.classList.add('active');
      };
      const end = (e) => {
        e.preventDefault();
        keys[key] = false;
        el.classList.remove('active');
      };
      el.addEventListener('touchstart', start, { passive: false });
      el.addEventListener('touchend', end, { passive: false });
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
      el.addEventListener('mouseleave', end);
    }

    bindBtn('btnUp', 'up');
    bindBtn('btnDown', 'down');
    bindBtn('btnLeft', 'left');
    bindBtn('btnRight', 'right');

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
      if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
      if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    canvas.addEventListener('pointerdown', (e) => {
      if (gameState !== 'PLAYING') return;
      const rect = canvas.getBoundingClientRect();
      const rawX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const rawY = (e.clientY - rect.top) * (canvas.height / rect.height);
      
      const clickX = rawX / currentScale;
      const clickY = (rawY / currentScale) + cameraY;

      if (clickY < tito.y - 15) keys.up = true;
      if (clickY > tito.y + 15) keys.down = true;
      if (clickX < tito.x - 15) keys.left = true;
      if (clickX > tito.x + 15) keys.right = true;
    });

    canvas.addEventListener('pointerup', () => {
      keys.up = false;
      keys.down = false;
      keys.left = false;
      keys.right = false;
    });
  </script>
