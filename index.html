<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141024">
<title>Encontrarte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:#0a0813;
  font-family:'Quicksand',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 35%,#26203f,#0a0813 72%)}

#stage{position:relative;width:100%;max-width:520px;height:100%;height:100dvh;
  max-height:980px;overflow:hidden;background:#141024}
@media(min-width:540px){#stage{border-radius:26px;height:94vh;
  border:1px solid rgba(255,220,160,.16);box-shadow:0 0 70px rgba(0,0,0,.8)}}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------------------------------------------------------- hud */
#hud{position:absolute;top:max(12px,env(safe-area-inset-top,12px));left:14px;right:14px;
  display:flex;justify-content:space-between;align-items:center;z-index:20;pointer-events:none}
.pill{background:rgba(255,252,244,.16);border:2px solid rgba(255,252,244,.34);
  backdrop-filter:blur(8px);border-radius:30px;padding:6px 12px;display:flex;
  align-items:center;gap:7px;color:#fff8ec;font-weight:700;font-size:.8rem;
  pointer-events:auto;opacity:0;transition:opacity .5s}
.pill.on{opacity:1}
.dots{display:flex;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,248,236,.3);
  border:1.5px solid rgba(255,248,236,.55);transition:background .4s,transform .4s}
.dot.done{background:#ffd98a;transform:scale(1.15)}
.icon-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,252,244,.16);
  border:2px solid rgba(255,252,244,.34);backdrop-filter:blur(8px);color:#fff8ec;
  display:flex;align-items:center;justify-content:center;font-size:.95rem;
  cursor:pointer;pointer-events:auto;transition:transform .15s}
.icon-btn:active{transform:scale(.9)}

/* ---------------------------------------------------------- pista */
#hint{position:absolute;left:50%;bottom:max(74px,calc(env(safe-area-inset-bottom,0px) + 74px));
  transform:translateX(-50%);z-index:22;pointer-events:none;
  background:rgba(16,12,28,.55);backdrop-filter:blur(6px);
  border:1.5px solid rgba(255,248,236,.22);border-radius:26px;
  padding:8px 18px;color:#fff8ec;font-size:.84rem;font-weight:600;
  opacity:0;transition:opacity .6s;white-space:nowrap;max-width:92vw}
#hint.on{opacity:.92}

/* ---------------------------------------------------------- cortina */
#curtain{position:absolute;inset:0;background:#0a0813;z-index:60;pointer-events:none;
  opacity:0;transition:opacity .7s ease}
#curtain.on{opacity:1;pointer-events:auto}

/* ---------------------------------------------------------- portada */
#title{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:28px;text-align:center;
  background:linear-gradient(175deg,#2a2350 0%,#4b3a6e 45%,#c98aa0 78%,#f6c9a4 100%);
  transition:opacity .8s;color:#fff8ec}
#title.gone{opacity:0;pointer-events:none}
#title .art{width:min(300px,78vw);margin-bottom:14px}
#title h1{font-family:'Baloo 2',cursive;font-size:3.1rem;line-height:1.02;
  letter-spacing:-.01em;text-shadow:0 4px 0 rgba(30,18,50,.28)}
#title .for{margin-top:6px;font-size:.8rem;letter-spacing:.28em;text-transform:uppercase;
  opacity:.75;font-weight:600}
#play{margin-top:30px;border:none;cursor:pointer;font-family:'Baloo 2',cursive;
  font-size:1.15rem;color:#5a2740;background:linear-gradient(180deg,#ffe6b8,#ffc98d);
  padding:13px 40px;border-radius:40px;box-shadow:0 6px 0 #d99a63,0 14px 26px rgba(0,0,0,.3);
  transition:transform .12s,box-shadow .12s}
#play:active{transform:translateY(4px);box-shadow:0 2px 0 #d99a63,0 8px 18px rgba(0,0,0,.3)}
#title .tip{margin-top:18px;font-size:.76rem;opacity:.6;font-weight:600}

/* ---------------------------------------------------------- fin */
#end{position:absolute;inset:0;z-index:52;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;padding:0 24px 46px;
  opacity:0;pointer-events:none;transition:opacity 1.4s}
#end.on{opacity:1;pointer-events:auto}
#end .again{border:none;cursor:pointer;font-family:'Quicksand',sans-serif;font-weight:700;
  font-size:.86rem;color:#fff8ec;background:rgba(255,252,244,.14);
  border:1.5px solid rgba(255,252,244,.3);backdrop-filter:blur(8px);
  padding:11px 26px;border-radius:30px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="pill" id="progress"><span>✧</span><span class="dots" id="dots"></span></div>
    <button class="icon-btn" id="btn-audio">♪</button>
  </div>

  <div id="hint"></div>
  <div id="curtain"></div>

  <div id="title">
    <div class="art" id="title-art"></div>
    <h1>Encontrarte</h1>
    <button id="play">Empezar</button>
    <div class="tip">se juega con un dedo · no se puede perder</div>
  </div>

  <div id="end">
    <button class="again" id="btn-again">volver a jugarlo</button>
  </div>
</div>
<script>
/* ==========================================================================
   LOS DOS MUNDOS — arte de los personajes (estilo plano, contorno negro)
   ========================================================================== */
const INK = '#1b1310';

/* Devuelve el SVG de un personaje en una pose dada.
   who: 'her' | 'him'
   p: {legA, legB, armA, armB}  ángulos en radianes (0 = colgando hacia abajo) */
function charSVG(who, p) {
  const L = (x, y, a, len) => [x + Math.sin(a) * len, y + Math.cos(a) * len];
  const legY = 196, legLen = 22, armY = 148, armLen = 26;
  const [l1x, l1y] = L(86, legY, p.legA, legLen);
  const [l2x, l2y] = L(114, legY, p.legB, legLen);
  const [a1x, a1y] = L(74, armY, p.armA, armLen);
  const [a2x, a2y] = L(126, armY, p.armB, armLen);

  const legs = `
  <path d="M86 ${legY} L${l1x.toFixed(1)} ${l1y.toFixed(1)}" fill="none" stroke-width="12"/>
  <path d="M114 ${legY} L${l2x.toFixed(1)} ${l2y.toFixed(1)}" fill="none" stroke-width="12"/>
  <ellipse cx="${l1x.toFixed(1)}" cy="${(l1y + 5).toFixed(1)}" rx="13" ry="8" fill="#fffaf2"/>
  <ellipse cx="${l2x.toFixed(1)}" cy="${(l2y + 5).toFixed(1)}" rx="13" ry="8" fill="#fffaf2"/>`;

  const arms = (skin) => `
  <path d="M74 ${armY} L${a1x.toFixed(1)} ${a1y.toFixed(1)}" fill="none" stroke-width="9"/>
  <path d="M126 ${armY} L${a2x.toFixed(1)} ${a2y.toFixed(1)}" fill="none" stroke-width="9"/>
  <circle cx="${a1x.toFixed(1)}" cy="${a1y.toFixed(1)}" r="8" fill="${skin}"/>
  <circle cx="${a2x.toFixed(1)}" cy="${a2y.toFixed(1)}" r="8" fill="${skin}"/>`;

  if (who === 'her') return `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
 <g stroke="${INK}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
  <path d="M100 26 C58 26 36 56 36 94 C36 122 30 150 26 172
           C24 184 34 190 42 184 C50 178 56 166 58 152
           C60 178 58 200 56 212 C55 222 66 226 72 218
           C80 206 84 180 84 152 L116 152
           C116 180 120 206 128 218 C134 226 145 222 144 212
           C142 200 140 178 142 152 C144 166 150 178 158 184
           C166 190 176 184 174 172 C170 150 164 122 164 94
           C164 56 142 26 100 26 Z" fill="#20150f"/>
  ${legs}
  <path d="M73 174 c-3 14 -2 22 0 28 h54 c2-6 3-14 0-28 z" fill="#9dc0dd"/>
  <path d="M100 182 v18" fill="none" stroke-width="2.5" stroke="#4d7ba0"/>
  <path d="M73 178 h54" fill="none" stroke="#4d7ba0" stroke-width="3"/>
  <path d="M100 158 c-13 0 -22 2 -24 5 l0 11 h48 l0-11 c-2-3 -11-5 -24-5 z" fill="#f7ddc2"/>
  <path d="M100 134 c-16 0 -26 5 -27 10 -2 7 -2 16 -1 22 h56 c1-6 1-15 -1-22 -1-5 -11-10 -27-10 z" fill="#ffffff"/>
  ${arms('#f7ddc2')}
  <circle cx="100" cy="82" r="54" fill="#fbe3ca"/>
  <path d="M100 26 C64 26 46 50 46 80 C46 66 54 54 64 48
           C78 56 100 58 118 52 C130 48 138 42 142 36
           C150 46 154 62 154 80 C154 50 136 26 100 26 Z" fill="#20150f"/>
  <path d="M100 26 C64 26 46 50 46 82 C46 44 66 22 100 22 C134 22 154 44 154 82 C154 50 136 26 100 26 Z" fill="#20150f"/>
 </g>
 <g stroke="#000" stroke-width="2" fill="none" opacity=".5" stroke-linecap="round">
  <path d="M58 62 C62 40 78 28 100 26"/><path d="M68 54 C74 36 90 26 110 26"/>
  <path d="M80 48 C88 32 104 26 122 30"/><path d="M92 44 C102 32 116 30 132 36"/>
 </g>
 <g fill="none" stroke="#e5bd5f" stroke-width="3.4" stroke-linecap="round">
  <path d="M50 96 a7 8 0 1 0 6 10"/><path d="M150 96 a7 8 0 1 1 -6 10"/>
 </g>
 <g>
  ${eyes(who, p)}
  <ellipse cx="66" cy="102" rx="9" ry="5.5" fill="#f39aa8" opacity=".75"/>
  <ellipse cx="134" cy="102" rx="9" ry="5.5" fill="#f39aa8" opacity=".75"/>
  ${mouth(p)}
 </g>
</svg>`;

  return `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
 <g stroke="${INK}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
  <path d="M100 24 C62 24 44 50 44 84 C44 92 44 98 43 104
           C41 116 54 120 60 110 C63 104 64 96 64 88 L136 88
           C136 96 137 104 140 110 C146 120 159 116 157 104
           C156 98 156 92 156 84 C156 50 138 24 100 24 Z" fill="#181210"/>
  <path d="M66 104 c-2 14 -4 24 -8 32 -4 8 6 14 12 8 6-6 10-20 10-36 z" fill="#181210"/>
  <path d="M134 104 c2 14 4 24 8 32 4 8 -6 14 -12 8 -6-6 -10-20 -10-36 z" fill="#181210"/>
  ${legs}
  <path d="M76 172 c-2 12 -2 20 -1 26 h50 c1-6 1-14 -1-26 z" fill="#4a5a78"/>
  <path d="M100 134 c-16 0 -26 5 -28 10 -2 6 -3 20 -2 28 h60 c1-8 0-22 -2-28 -2-5 -12-10 -28-10 z" fill="#26262f"/>
  <path d="M88 136 c3 7 7 10 12 10 s9-3 12-10" fill="none" stroke-width="3"/>
  ${arms('#f6d6b6')}
  <circle cx="100" cy="82" r="54" fill="#f9dcbd"/>
  <path d="M100 22 C74 22 56 38 50 62 c6-4 10-10 12-16
           c4 10 12 16 22 18 c-4-8 -4-16 -1-22
           c6 10 16 16 28 16 c-4-6 -6-14 -5-20
           c8 12 20 18 32 16 c-4-6 -6-12 -6-18
           c8 8 14 16 16 26 C144 38 126 22 100 22 Z" fill="#181210"/>
  <path d="M100 22 C68 22 48 42 48 74 C48 40 70 18 100 18 C130 18 152 40 152 74 C152 42 132 22 100 22 Z" fill="#181210"/>
 </g>
 <g>
  ${eyes(who, p)}
  <ellipse cx="64" cy="101" rx="8.5" ry="5" fill="#e8848e" opacity=".55"/>
  <ellipse cx="136" cy="101" rx="8.5" ry="5" fill="#e8848e" opacity=".55"/>
  ${mouth(p)}
 </g>
</svg>`;
}

function eyes(who, p) {
  const bw = who === 'him' ? 3.6 : 3;
  const lashes = who === 'her' ? `
  <path d="M71 81 l-4-3 M72 85 l-5-1" stroke="#171210" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M129 81 l4-3 M128 85 l5-1" stroke="#171210" stroke-width="2.6" stroke-linecap="round"/>` : '';
  if (p.closed) return `
  <path d="M72 88 c4-5 12-5 16 0" stroke="#171210" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M112 88 c4-5 12-5 16 0" stroke="#171210" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  ${lashes}
  <path d="M${who === 'him' ? 69 : 70} 7${who === 'him' ? 3 : 4} c5-4 1${who === 'him' ? 3 : 2}-4 1${who === 'him' ? 7 : 6} 0" stroke="#171210" stroke-width="${bw}" fill="none" stroke-linecap="round"/>
  <path d="M114 73 c4-4 12-4 17 0" stroke="#171210" stroke-width="${bw}" fill="none" stroke-linecap="round"/>`;
  return `
  <ellipse cx="80" cy="88" rx="7" ry="9.5" fill="#171210"/>
  <ellipse cx="120" cy="88" rx="7" ry="9.5" fill="#171210"/>
  <circle cx="82.5" cy="84.5" r="2.6" fill="#fff"/>
  <circle cx="122.5" cy="84.5" r="2.6" fill="#fff"/>
  ${lashes}
  <path d="M70 74 c5-4 12-4 16-1" stroke="#171210" stroke-width="${bw}" fill="none" stroke-linecap="round"/>
  <path d="M114 73 c4-3 12-3 17 1" stroke="#171210" stroke-width="${bw}" fill="none" stroke-linecap="round"/>`;
}

function mouth(p) {
  if (p.sad) return `<path d="M93 110 c4-4 10-4 14 0" stroke="#171210" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
  if (p.wow) return `<ellipse cx="100" cy="108" rx="5" ry="6" fill="#171210"/>`;
  return `<path d="M93 107 c4 5 10 5 14 0" stroke="#171210" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
}

/* ---------------------------------------------------------------- poses */
const POSES = {
  idle:  { legA: 0,     legB: 0,     armA: 0.30,  armB: -0.30 },
  walk1: { legA: 0.45,  legB: -0.45, armA: -0.45, armB: 0.45 },
  walk2: { legA: -0.45, legB: 0.45,  armA: 0.45,  armB: -0.45 },
  jump:  { legA: 0.35,  legB: -0.20, armA: -2.30, armB: 2.30, wow: true },
  reach: { legA: 0.10,  legB: -0.10, armA: -1.55, armB: -1.55 },
  sit:   { legA: 1.25,  legB: 1.05,  armA: 0.20,  armB: -0.20 },
  happy: { legA: 0,     legB: 0,     armA: -2.10, armB: 2.10, closed: true },
  sad:   { legA: 0,     legB: 0,     armA: 0.12,  armB: -0.12, sad: true },
  hold:  { legA: 0,     legB: 0,     armA: 0.22,  armB: 1.42, closed: true }
};

/* ---------------------------------------------------------------- sprites */
const SPRITES = {};
function loadSprites() {
  const jobs = [];
  ['her', 'him'].forEach(who => {
    SPRITES[who] = {};
    Object.keys(POSES).forEach(name => {
      const svg = charSVG(who, POSES[name]);
      const img = new Image();
      const p = new Promise(res => { img.onload = res; img.onerror = res; });
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      SPRITES[who][name] = img;
      jobs.push(p);
    });
  });
  return Promise.all(jobs);
}

/* Dibuja un personaje. h = altura deseada en px; x,y = pies del personaje */
function drawChar(ctx, who, pose, x, y, h, dir = 1, alpha = 1) {
  const img = SPRITES[who] && SPRITES[who][pose];
  if (!img || !img.complete || !img.naturalWidth) return;
  const w = h * (200 / 260);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  if (dir < 0) ctx.scale(-1, 1);
  ctx.drawImage(img, -w / 2, -h, w, h);
  ctx.restore();
}

/* ==========================================================================
   AUDIO — clima sonoro por mundo
   ========================================================================== */
const AUDIO = {
  ctx: null, muted: false, timer: null, step: 0, mode: 'clouds',

  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.filter = this.ctx.createBiquadFilter();
    this.filter.type = 'lowpass'; this.filter.frequency.value = 3000;
    this.master = this.ctx.createGain(); this.master.gain.value = .3;
    this.delay = this.ctx.createDelay(); this.delay.delayTime.value = .38;
    this.fb = this.ctx.createGain(); this.fb.gain.value = .32;
    this.wet = this.ctx.createGain(); this.wet.gain.value = .38;
    this.delay.connect(this.fb); this.fb.connect(this.delay);
    this.delay.connect(this.wet); this.wet.connect(this.master);
    this.filter.connect(this.master); this.filter.connect(this.delay);
    this.master.connect(this.ctx.destination);
    this.play();
  },

  PROG: {
    clouds: { bpm: 3600, ch: [[261.63,[329.63,392.00,523.25]],[220.00,[329.63,440.00,523.25]],
                            [246.94,[293.66,392.00,493.88]],[196.00,[293.66,392.00,493.88]]] },
    forest: { bpm: 4300, ch: [[220.00,[261.63,329.63,415.30]],[174.61,[261.63,349.23,440.00]],
                              [196.00,[246.94,293.66,392.00]],[164.81,[246.94,329.63,392.00]]] },
    river:  { bpm: 3400, ch: [[196.00,[293.66,349.23,440.00]],[164.81,[246.94,329.63,415.30]],
                              [220.00,[277.18,329.63,440.00]],[146.83,[261.63,349.23,440.00]]] },
    city:   { bpm: 2600, ch: [[293.66,[349.23,440.00,587.33]],[246.94,[329.63,415.30,493.88]],
                              [261.63,[329.63,392.00,523.25]],[196.00,[293.66,392.00,493.88]]] },
    bridge: { bpm: 4600, ch: [[174.61,[261.63,329.63,392.00]],[196.00,[293.66,349.23,440.00]],
                              [146.83,[220.00,349.23,440.00]],[164.81,[246.94,329.63,415.30]]] }
  },

  note(f, t, dur, g, type = 'triangle') {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), gg = this.ctx.createGain();
    o.type = type; o.frequency.value = f;
    gg.gain.setValueAtTime(0, t);
    gg.gain.linearRampToValueAtTime(g, t + .03);
    gg.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(gg); gg.connect(this.filter);
    o.start(t); o.stop(t + dur + .05);
  },

  tick() {
    if (!this.ctx || this.muted) return;
    const P = this.PROG[this.mode] || this.PROG.clouds;
    const c = P.ch[this.step % P.ch.length], now = this.ctx.currentTime;
    const long = P.bpm / 1000;
    this.note(c[0], now, long * 1.25, .11, 'sine');
    c[1].forEach((f, i) => this.note(f, now + i * .12, long, .062, 'triangle'));
    if (Math.random() > .4) {
      const m = c[1][Math.floor(Math.random() * c[1].length)] * 2;
      this.note(m, now + .9 + Math.random() * .8, 2, .04, 'sine');
    }
    this.step++;
  },

  play() {
    if (!this.ctx || this.timer) return;
    this.tick();
    this.timer = setInterval(() => this.tick(), (this.PROG[this.mode] || this.PROG.clouds).bpm);
  },

  setMode(m) {
    if (m === this.mode || !this.PROG[m]) return;
    this.mode = m; this.step = 0;
    if (this.timer) { clearInterval(this.timer); this.timer = setInterval(() => this.tick(), this.PROG[m].bpm); }
    if (this.filter) this.filter.frequency.linearRampToValueAtTime(
      m === 'city' ? 3600 : m === 'forest' ? 1900 : 3000, this.ctx.currentTime + 2);
  },

  toggle() {
    this.unlock();
    if (!this.ctx) return true;
    this.muted = !this.muted;
    this.master.gain.linearRampToValueAtTime(this.muted ? 0 : .3, this.ctx.currentTime + .3);
    if (!this.muted && this.ctx.state === 'suspended') this.ctx.resume();
    return !this.muted;
  },

  fx(kind) {
    if (!this.ctx || this.muted) return;
    const n = this.ctx.currentTime;
    switch (kind) {
      case 'pop':   this.note(700, n, .14, .05, 'sine'); this.note(1050, n + .04, .18, .035, 'sine'); break;
      case 'light': [880, 1108, 1318].forEach((f, i) => this.note(f, n + i * .07, 1.4, .05, 'sine')); break;
      case 'star':  [1318, 1760, 2093].forEach((f, i) => this.note(f, n + i * .05, .9, .04, 'sine')); break;
      case 'land':  this.note(180, n, .18, .07, 'sine'); this.note(120, n, .24, .05, 'sine'); break;
      case 'jump':  this.note(440, n, .12, .045, 'sine'); this.note(660, n + .06, .16, .035, 'sine'); break;
      case 'snap':  this.note(300, n, .1, .06, 'square'); this.note(150, n + .02, .2, .04, 'sine'); break;
      case 'chime': [1046, 1318, 1568, 2093].forEach((f, i) => this.note(f, n + i * .1, 2.6, .055, 'sine')); break;
      case 'break': this.note(90, n, .8, .12, 'sine'); this.note(130, n + .05, .6, .07, 'triangle'); break;
      case 'heart': this.note(392, n, .8, .07, 'sine'); this.note(523, n + .12, 1.4, .07, 'sine');
                    this.note(659, n + .26, 1.8, .05, 'sine'); break;
    }
  }
};

/* ==========================================================================
   MOTOR
   ========================================================================== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');

const VW = 400;              // ancho virtual fijo
let VH = 700, scale = 1, W = 400, H = 700;

function resize() {
  const r = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = Math.floor(W * dpr);
  cv.height = Math.floor(H * dpr);
  scale = W / VW;
  VH = H / scale;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  if (SC.cur && SC.cur.resize) SC.cur.resize();
}
window.addEventListener('resize', resize);

/* ---------------------------------------------------------------- utils */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const rnd = (i, a = 1) => ((Math.sin(i * 12.9898) * 43758.5453) % 1 + 1) % 1 * a;
const dist = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);

function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mix(c1, c2, t) {
  const a = hex(c1), b = hex(c2);
  return `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`;
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
/* forma plana con contorno */
function ink(fill, lw = 3.2, stroke = '#1b1310') {
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw > 0) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
}
function star(x, y, r, pts = 5, inner = .45) {
  ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) {
    const a = (i / (pts * 2)) * Math.PI * 2 - Math.PI / 2;
    const rr2 = i % 2 ? r * inner : r;
    ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr2, y + Math.sin(a) * rr2);
  }
  ctx.closePath();
}
function heart(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * .7);
  ctx.bezierCurveTo(x - s, y - s * .2, x - s * .55, y - s, x, y - s * .35);
  ctx.bezierCurveTo(x + s * .55, y - s, x + s, y - s * .2, x, y + s * .7);
  ctx.closePath();
}

/* ---------------------------------------------------------------- input */
const IN = { x: 0, y: 0, down: false, justDown: false, justUp: false, moved: false };
function toV(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
}
cv.addEventListener('pointerdown', e => {
  const p = toV(e); IN.x = p.x; IN.y = p.y; IN.down = true; IN.justDown = true; IN.moved = false;
  if (SC.cur && SC.cur.down) SC.cur.down(p.x, p.y);
  AUDIO.unlock();
});
cv.addEventListener('pointermove', e => {
  const p = toV(e);
  if (IN.down && dist(p.x, p.y, IN.x, IN.y) > 4) IN.moved = true;
  IN.x = p.x; IN.y = p.y;
  if (SC.cur && SC.cur.move) SC.cur.move(p.x, p.y);
});
const upH = e => {
  IN.down = false; IN.justUp = true;
  if (SC.cur && SC.cur.up) SC.cur.up(IN.x, IN.y);
};
cv.addEventListener('pointerup', upH);
cv.addEventListener('pointercancel', upH);

/* ---------------------------------------------------------------- hud */
const elHint = document.getElementById('hint');
const elDots = document.getElementById('dots');
const elProgress = document.getElementById('progress');
let hintTimer = null;
function hint(txt, ms = 3600) {
  clearTimeout(hintTimer);
  elHint.textContent = txt;
  elHint.classList.add('on');
  if (ms) hintTimer = setTimeout(() => elHint.classList.remove('on'), ms);
}
function hideHint() { clearTimeout(hintTimer); elHint.classList.remove('on'); }

const WORLDS = ['clouds', 'forest', 'river', 'city', 'bridge'];
function buildDots() {
  elDots.innerHTML = WORLDS.map(() => '<i class="dot"></i>').join('');
}
function setProgress(n) {
  elProgress.classList.add('on');
  [...elDots.children].forEach((d, i) => d.classList.toggle('done', i < n));
}

/* ---------------------------------------------------------------- escenas */
const SC = { cur: null, list: {}, t: 0 };
const curtain = document.getElementById('curtain');
let busy = false;

function go(name, delay = 0) {
  if (busy) return;
  busy = true;
  hideHint();
  curtain.classList.add('on');
  setTimeout(() => {
    SC.cur = SC.list[name];
    SC.t = 0;
    if (SC.cur.enter) SC.cur.enter();
    setTimeout(() => {
      curtain.classList.remove('on');
      busy = false;
    }, 160);
  }, 720 + delay);
}

/* ---------------------------------------------------------------- loop */
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, .05);
  last = now;
  SC.t += dt;
  ctx.clearRect(0, 0, VW, VH);
  if (SC.cur) {
    if (SC.cur.update) SC.cur.update(dt);
    if (SC.cur.draw) SC.cur.draw(dt);
  }
  IN.justDown = false; IN.justUp = false;
  requestAnimationFrame(loop);
}

/* ---------------------------------------------------------------- arranque */
document.getElementById('btn-audio').addEventListener('click', e => {
  e.currentTarget.textContent = AUDIO.toggle() ? '♪' : '✕';
});
document.getElementById('btn-again').addEventListener('click', () => location.reload());

buildDots();
resize();
loadSprites().then(() => {
  // miniatura de la portada
  const art = document.getElementById('title-art');
  art.innerHTML =
    `<svg viewBox="0 0 460 260" width="100%">
       <image href="${SPRITES.her.idle.src}" x="30" y="0" width="200" height="260"/>
       <image href="${SPRITES.him.idle.src}" x="230" y="0" width="200" height="260"/>
     </svg>`;
  requestAnimationFrame(loop);
});

document.getElementById('play').addEventListener('click', () => {
  AUDIO.unlock();
  document.getElementById('title').classList.add('gone');
  SC.cur = SC.list.intro;
  SC.t = 0;
  if (SC.cur.enter) SC.cur.enter();
});

/* ==========================================================================
   HELPERS COMPARTIDOS
   ========================================================================== */
function mkWalker(who, x, y, h) {
  return {
    who, x, y, h, dir: 1, t: 0, pose: 'idle', tx: null, ty: null, speed: 60,
    setPose(p) { this.pose = p; },
    walkTo(x, y, cb) { this.tx = x; this.ty = (y === undefined ? this.y : y); this.cb = cb; },
    update(dt) {
      this.t += dt;
      if (this.tx !== null) {
        const dx = this.tx - this.x, dy = this.ty - this.y;
        const d = Math.hypot(dx, dy);
        if (d < 2) {
          this.x = this.tx; this.y = this.ty; this.tx = null;
          this.pose = 'idle';
          if (this.cb) { const c = this.cb; this.cb = null; c(); }
        } else {
          const step = Math.min(this.speed * dt, d);
          this.x += dx / d * step; this.y += dy / d * step;
          if (Math.abs(dx) > 1) this.dir = dx > 0 ? 1 : -1;
          this.pose = (Math.floor(this.t * 7) % 2) ? 'walk1' : 'walk2';
        }
      }
    },
    draw(alpha = 1) { drawChar(ctx, this.who, this.pose, this.x, this.y, this.h, this.dir, alpha); }
  };
}

/* nubes gordas de fondo */
function puff(x, y, s, fill, lw = 0) {
  ctx.beginPath();
  ctx.arc(x - s * .62, y, s * .58, 0, 7);
  ctx.arc(x - s * .12, y - s * .38, s * .72, 0, 7);
  ctx.arc(x + s * .52, y - s * .12, s * .6, 0, 7);
  ctx.arc(x + s * .1, y + s * .22, s * .62, 0, 7);
  ink(fill, lw);
}
function skyGrad(stops) {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s));
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
}
function sparkles(list, dt) {
  list.forEach(s => {
    s.ph += dt * s.sp;
    const a = (Math.sin(s.ph) * .5 + .5);
    ctx.globalAlpha = a * .9;
    ctx.fillStyle = '#fff6d8';
    star(s.x, s.y + Math.sin(s.ph * .6) * 4, s.r * (.7 + a * .5), 4, .34);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

/* ==========================================================================
   INTRO — juntos, y algo los separa
   ========================================================================== */
SC.list.intro = (() => {
  let ph = 0, t = 0, split = 0, shake = 0, fall = 0;
  let her, him;
  return {
    enter() {
      ph = 0; t = 0; split = 0; shake = 0; fall = 0;
      her = mkWalker('her', VW * .5 - 34, VH * .68, 120);
      him = mkWalker('him', VW * .5 + 34, VH * .68, 122);
      her.dir = 1; him.dir = -1;
      AUDIO.setMode('clouds');
      setProgress(0);
      setTimeout(() => hint('tocá la pantalla', 0), 900);
    },
    down() {
      if (ph === 0) { ph = 1; t = 0; hideHint(); AUDIO.fx('break'); }
    },
    update(dt) {
      t += dt;
      her.update(dt); him.update(dt);
      if (ph === 1) {
        shake = Math.sin(t * 40) * (3 * Math.min(t / .3, 1));
        her.setPose('sad'); him.setPose('sad');
        if (t > 1.1) { ph = 2; t = 0; }
      } else if (ph === 2) {
        shake = Math.sin(t * 30) * 2 * Math.max(0, 1 - t);
        split = ease(Math.min(t / 1.7, 1)) * 106;
        if (t > 2.2) { ph = 3; t = 0; AUDIO.fx('land'); }
      } else if (ph === 3) {
        fall = ease(Math.min(t / 1.2, 1));
        if (t > 1.5) { ph = 4; go('clouds'); }
      }
    },
    draw() {
      skyGrad(['#3b2f63', '#7a5480', '#d98c8a', '#f7c9a0']);
      ctx.save();
      ctx.translate(shake, 0);
      // sol
      ctx.beginPath(); ctx.arc(VW * .72, VH * .3, 42, 0, 7);
      ink('#ffe9b8', 3.4);
      // nubes lejanas
      for (let i = 0; i < 5; i++) {
        const x = rnd(i * 3.1, VW), y = VH * .18 + rnd(i * 7.7, VH * .22);
        ctx.globalAlpha = .5; puff(x, y, 26 + rnd(i * 2.2, 16), '#fff3e2', 0); ctx.globalAlpha = 1;
      }
      const gy = VH * .68;
      // suelo partido en dos
      [-1, 1].forEach(s => {
        ctx.save();
        ctx.translate(s * split, fall * (s < 0 ? 240 : -40));
        ctx.beginPath();
        ctx.moveTo(s < 0 ? -60 : VW / 2, gy + 4);
        ctx.lineTo(s < 0 ? VW / 2 : VW + 60, gy + 4);
        ctx.lineTo(s < 0 ? VW / 2 - 10 : VW + 60, gy + 150);
        ctx.lineTo(s < 0 ? -60 : VW / 2 + 10, gy + 150);
        ctx.closePath();
        ink('#8b6a4a', 3.6);
        ctx.beginPath();
        rr(s < 0 ? -60 : VW / 2, gy - 12, VW / 2 + 60, 26, 12);
        ink('#7cc36a', 3.6);
        ctx.restore();
      });
      ctx.restore();
      // personajes
      ctx.save();
      ctx.translate(-split + shake, fall * 240);
      her.draw();
      ctx.restore();
      ctx.save();
      ctx.translate(split + shake, fall * -40);
      him.draw();
      ctx.restore();
    }
  };
})();

/* ==========================================================================
   MUNDO 1 — EL MAR DE NUBES
   ========================================================================== */
SC.list.clouds = (() => {
  let slots, pieces, drag = null, her, done = false, walking = false, lampGlow = 0, ph = 0;
  const P = () => [
    { x: VW * .20, y: VH * .78 },
    { x: VW * .50, y: VH * .66 },
    { x: VW * .26, y: VH * .53 },
    { x: VW * .58, y: VH * .41 },
    { x: VW * .34, y: VH * .28 }
  ];
  return {
    enter() {
      const pts = P();
      slots = pts.map((p, i) => ({ ...p, filled: i === 0 || i === 4, i }));
      // piezas sueltas abajo, desordenadas
      pieces = [
        { x: VW * .80, y: VH * .84, r: 33, slot: null },
        { x: VW * .16, y: VH * .93, r: 30, slot: null },
        { x: VW * .52, y: VH * .90, r: 32, slot: null }
      ];
      drag = null; done = false; walking = false; ph = 0; lampGlow = 0;
      her = mkWalker('her', pts[0].x, pts[0].y - 4, 92);
      AUDIO.setMode('clouds');
      setProgress(0);
      hint('arrastrá las islas para armar el camino', 5200);
    },
    down(x, y) {
      if (walking) return;
      for (let i = pieces.length - 1; i >= 0; i--) {
        const p = pieces[i];
        if (p.slot === null && dist(x, y, p.x, p.y) < p.r + 14) {
          drag = p; pieces.splice(i, 1); pieces.push(p); AUDIO.fx('pop'); return;
        }
      }
    },
    move(x, y) { if (drag) { drag.x = x; drag.y = y; } },
    dbg() { return { pieces, slots, walking }; },
    up() {
      if (!drag) return;
      let best = null, bd = 1e9;
      slots.forEach(s => {
        if (s.filled) return;
        const d = dist(drag.x, drag.y, s.x, s.y);
        if (d < bd) { bd = d; best = s; }
      });
      if (best && bd < 62) {
        drag.x = best.x; drag.y = best.y; drag.slot = best.i; best.filled = true;
        AUDIO.fx('snap');
      }
      drag = null;
      if (slots.every(s => s.filled) && !done) {
        done = true;
        setTimeout(() => this.walk(), 500);
      }
    },
    walk() {
      walking = true; hideHint();
      const pts = P();
      let i = 1;
      const next = () => {
        if (i >= pts.length) {
          ph = 1;
          AUDIO.fx('light');
          setTimeout(() => { setProgress(1); go('forest'); }, 1800);
          return;
        }
        const p = pts[i++];
        her.walkTo(p.x, p.y - 4, next);
      };
      next();
    },
    update(dt) {
      her.update(dt);
      if (ph === 1) lampGlow = Math.min(1, lampGlow + dt * 1.2);
    },
    draw(dt) {
      skyGrad(['#a8d8ef', '#cfe6f3', '#f7dcd0', '#f9c9b0']);
      // sol
      ctx.beginPath(); ctx.arc(VW * .8, VH * .14, 34, 0, 7); ink('#fff0c2', 3);
      // mar de nubes al fondo
      for (let i = 0; i < 10; i++) {
        const x = ((rnd(i * 4.4, VW * 1.4) + SC.t * (3 + rnd(i) * 4)) % (VW * 1.4)) - VW * .2;
        const y = VH * .1 + rnd(i * 9.1, VH * .85);
        ctx.globalAlpha = .45 + rnd(i * 5.5) * .3;
        puff(x, y, 22 + rnd(i * 2.7, 22), '#ffffff', 0);
        ctx.globalAlpha = 1;
      }
      // huecos vacíos
      slots.forEach(s => {
        if (s.filled) return;
        ctx.setLineDash([7, 7]);
        ctx.beginPath(); ctx.arc(s.x, s.y + 14, 32, 0, 7);
        ctx.strokeStyle = 'rgba(60,40,70,.4)'; ctx.lineWidth = 3; ctx.stroke();
        ctx.setLineDash([]);
      });
      // islas colocadas
      slots.forEach(s => {
        if (!s.filled) return;
        island(s.x, s.y, 36 + (s.i === 0 || s.i === 4 ? 6 : 0));
      });
      // farol de él en la última isla
      const last = slots[4];
      lamp(last.x + 26, last.y - 6, .85, .5 + lampGlow * .5);
      // piezas sueltas
      pieces.forEach(p => { if (p.slot === null) island(p.x, p.y, p.r, true); });
      her.draw();
    }
  };

  function island(x, y, r, floating) {
    const bob = floating ? Math.sin(SC.t * 2 + x) * 3 : Math.sin(SC.t * 1.4 + x * .1) * 2;
    ctx.save(); ctx.translate(0, bob);
    ctx.beginPath();
    ctx.moveTo(x - r, y + 6);
    ctx.quadraticCurveTo(x - r * .7, y + r * 1.5, x, y + r * 1.9);
    ctx.quadraticCurveTo(x + r * .7, y + r * 1.5, x + r, y + 6);
    ctx.closePath();
    ink('#a97b52', 3.4);
    ctx.beginPath();
    ctx.ellipse(x, y + 4, r, r * .42, 0, 0, 7);
    ink('#7cc36a', 3.4);
    ctx.beginPath();
    ctx.ellipse(x - r * .3, y + 1, r * .3, r * .16, -.2, 0, 7);
    ink('#95d67f', 0);
    ctx.restore();
  }
  function lamp(x, y, s, glow) {
    ctx.save(); ctx.translate(x, y + Math.sin(SC.t * 1.6) * 2); ctx.scale(s, s);
    const g = ctx.createRadialGradient(0, -22, 2, 0, -22, 56);
    g.addColorStop(0, `rgba(255,224,150,${.55 * glow})`);
    g.addColorStop(1, 'rgba(255,224,150,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -22, 56, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -14);
    ctx.strokeStyle = '#1b1310'; ctx.lineWidth = 3.4; ctx.stroke();
    ctx.beginPath(); rr(-11, -38, 22, 26, 5);
    ink(`rgba(255,232,170,${.35 + glow * .65})`, 3.4);
    ctx.beginPath(); ctx.moveTo(-13, -38); ctx.lineTo(13, -38); ctx.lineTo(0, -50); ctx.closePath();
    ink('#c58a4e', 3.4);
    ctx.restore();
  }
})();

/* ==========================================================================
   MUNDO 2 — EL BOSQUE DE FAROLES
   ========================================================================== */
SC.list.forest = (() => {
  let lamps, her, lit = 0, walking = false, flies = [], ph = 0;
  return {
    enter() {
      lamps = [
        { x: VW * .22, y: VH * .70, on: false },
        { x: VW * .62, y: VH * .62, on: false },
        { x: VW * .34, y: VH * .50, on: false },
        { x: VW * .72, y: VH * .40, on: true },   // el que ya estaba encendido
        { x: VW * .46, y: VH * .30, on: false }
      ];
      lit = 1; walking = false; ph = 0; flies = [];
      her = mkWalker('her', VW * .12, VH * .84, 88);
      AUDIO.setMode('forest');
      setProgress(1);
      hint('tocá los faroles para encenderlos', 5000);
    },
    down(x, y) {
      if (walking) return;
      lamps.forEach(l => {
        if (!l.on && dist(x, y, l.x, l.y - 22) < 42) {
          l.on = true; lit++; AUDIO.fx('light');
          for (let i = 0; i < 12; i++)
            flies.push({ x: l.x, y: l.y - 22, ph: Math.random() * 6, sp: .6 + Math.random(), r: 26 + Math.random() * 60, a: 1 });
          if (lit >= lamps.length && !walking) {
            walking = true; hideHint();
            setTimeout(() => {
              let i = 0;
              const order = [...lamps].sort((a, b) => b.y - a.y);
              const next = () => {
                if (i >= order.length) {
                  ph = 1;
                  setTimeout(() => { setProgress(2); go('river'); }, 1600);
                  return;
                }
                const l = order[i++];
                her.walkTo(l.x, l.y + 6, next);
              };
              next();
            }, 700);
          }
        }
      });
    },
    dbg() { return { lamps, lit, walking }; },
    update(dt) {
      her.update(dt);
      flies.forEach(f => { f.ph += dt * f.sp; f.a = Math.min(1, f.a + dt); });
    },
    draw(dt) {
      const bright = clamp((lit - 1) / (lamps.length - 1), 0, 1);
      skyGrad([mix('#0d1226', '#243a5e', bright), mix('#141a33', '#33507a', bright),
               mix('#1a1f3a', '#3f5f88', bright)]);
      // árboles en capas
      for (let layer = 0; layer < 3; layer++) {
        const sc = .5 + layer * .3, base = VH * (.55 + layer * .16);
        for (let i = 0; i < 7; i++) {
          const x = (i * VW / 6 + layer * 30 + rnd(i * 3 + layer, 40)) % (VW + 80) - 40;
          const h = (90 + rnd(i * 7 + layer * 3, 70)) * sc;
          ctx.fillStyle = mix('#0a0e1c', '#1d2b45', bright * (1 - layer * .2));
          ctx.beginPath();
          ctx.moveTo(x - h * .38, base + 30);
          ctx.lineTo(x, base - h);
          ctx.lineTo(x + h * .38, base + 30);
          ctx.closePath(); ctx.fill();
          ctx.fillRect(x - h * .05, base - 6, h * .1, 40);
        }
      }
      // suelo
      ctx.fillStyle = mix('#0b1020', '#22355a', bright);
      ctx.beginPath(); ctx.moveTo(0, VH * .84);
      ctx.quadraticCurveTo(VW * .5, VH * .80, VW, VH * .86);
      ctx.lineTo(VW, VH); ctx.lineTo(0, VH); ctx.closePath(); ctx.fill();
      // luciérnagas
      flies.forEach(f => {
        const x = f.x + Math.cos(f.ph) * f.r, y = f.y + Math.sin(f.ph * 1.3) * f.r * .6;
        const g = ctx.createRadialGradient(x, y, 0, x, y, 12);
        g.addColorStop(0, `rgba(255,240,160,${.8 * f.a})`);
        g.addColorStop(1, 'rgba(255,240,160,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 12, 0, 7); ctx.fill();
        ctx.fillStyle = `rgba(255,252,220,${f.a})`;
        ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 7); ctx.fill();
      });
      // faroles
      lamps.forEach(l => hangingLamp(l.x, l.y, l.on));
      her.draw();
    }
  };

  function hangingLamp(x, y, on) {
    const sw = Math.sin(SC.t * 1.3 + x * .05) * .05;
    ctx.save(); ctx.translate(x, y - 74); ctx.rotate(sw);
    ctx.beginPath(); ctx.moveTo(0, -40); ctx.lineTo(0, 4);
    ctx.strokeStyle = '#1b1310'; ctx.lineWidth = 2.6; ctx.stroke();
    if (on) {
      const g = ctx.createRadialGradient(0, 26, 3, 0, 26, 90);
      g.addColorStop(0, 'rgba(255,222,140,.55)');
      g.addColorStop(1, 'rgba(255,222,140,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 26, 90, 0, 7); ctx.fill();
    }
    ctx.beginPath(); rr(-13, 4, 26, 32, 6);
    ink(on ? '#ffe8a8' : 'rgba(180,190,210,.35)', 3.4);
    ctx.beginPath(); ctx.moveTo(-15, 4); ctx.lineTo(15, 4); ctx.lineTo(0, -10); ctx.closePath();
    ink(on ? '#e0a45c' : '#5b6480', 3.4);
    if (on) { ctx.beginPath(); ctx.arc(0, 20, 5, 0, 7); ink('#fff6cf', 0); }
    ctx.restore();
  }
})();

const GAME = { stars: 0 };

/* ==========================================================================
   MUNDO 3 — EL RÍO DE ESTRELLAS
   ========================================================================== */
SC.list.river = (() => {
  let boat, stars, prog, her, ph, caught, ripples;
  const NEED = 12;
  return {
    enter() {
      boat = { x: VW * .5, tx: VW * .5, y: VH * .76 };
      stars = []; ripples = []; prog = 0; ph = 0; caught = 0; GAME.stars = 0;
      her = mkWalker('her', boat.x, boat.y + 6, 74);
      AUDIO.setMode('river');
      setProgress(2);
      hint('deslizá el dedo para mover la barca', 5000);
    },
    down(x) { boat.tx = clamp(x, 40, VW - 40); },
    move(x) { if (IN.down) boat.tx = clamp(x, 40, VW - 40); },
    update(dt) {
      boat.x = lerp(boat.x, boat.tx, Math.min(1, dt * 7));
      her.x = boat.x; her.y = boat.y + 6 + Math.sin(SC.t * 2.2) * 2.5;
      her.dir = boat.tx > boat.x + 1 ? 1 : boat.tx < boat.x - 1 ? -1 : her.dir;
      her.update(dt);

      if (ph === 0) {
        prog += dt * .055;
        // spawn de estrellas
        if (Math.random() < dt * 2.1 && stars.length < 9) {
          stars.push({
            x: 42 + Math.random() * (VW - 84), y: -20,
            vy: 48 + Math.random() * 34, r: 8 + Math.random() * 5,
            sp: Math.random() * 6, got: 0, heart: Math.random() < .12
          });
        }
        stars.forEach(s => {
          if (s.got) { s.got += dt * 2.4; return; }
          s.y += s.vy * dt; s.sp += dt * 3;
          if (dist(s.x, s.y, boat.x, boat.y - 18) < 40) {
            s.got = .01; caught++; GAME.stars++;
            AUDIO.fx('star');
            ripples.push({ x: s.x, y: s.y, r: 6, a: 1 });
          }
        });
        stars = stars.filter(s => s.y < VH + 40 && (s.got || 0) < 1);
        if (prog >= 1 || caught >= NEED) {
          ph = 1; hideHint();
          setTimeout(() => { setProgress(3); go('city'); }, 2200);
        }
      }
      ripples.forEach(r => { r.r += dt * 60; r.a -= dt * 1.6; });
      ripples = ripples.filter(r => r.a > 0);
    },
    draw() {
      skyGrad(['#141232', '#252352', '#3d3470', '#5b4a86']);
      // estrellas fijas
      for (let i = 0; i < 70; i++) {
        const x = rnd(i * 3.7, VW), y = rnd(i * 8.3, VH * .58);
        ctx.globalAlpha = .3 + .6 * Math.abs(Math.sin(SC.t * .8 + i));
        ctx.fillStyle = '#fff6e0';
        ctx.fillRect(x, y, rnd(i * 2.2) > .85 ? 2.2 : 1.4, rnd(i * 2.2) > .85 ? 2.2 : 1.4);
      }
      ctx.globalAlpha = 1;
      // luna
      ctx.beginPath(); ctx.arc(VW * .78, VH * .13, 26, 0, 7); ink('#fdf3d6', 3);
      // orilla del final acercándose
      if (prog > .55) {
        const k = (prog - .55) / .45;
        ctx.save(); ctx.globalAlpha = Math.min(1, k * 1.6);
        ctx.beginPath();
        ctx.moveTo(0, VH * .58 - k * 30);
        ctx.quadraticCurveTo(VW * .5, VH * .5 - k * 40, VW, VH * .58 - k * 30);
        ctx.lineTo(VW, VH * .62); ctx.lineTo(0, VH * .62); ctx.closePath();
        ink('#2c2a56', 3);
        ctx.restore();
      }
      // agua
      const wy = VH * .60;
      const g = ctx.createLinearGradient(0, wy, 0, VH);
      g.addColorStop(0, '#2b2a63'); g.addColorStop(1, '#16173c');
      ctx.fillStyle = g; ctx.fillRect(0, wy, VW, VH - wy);
      // ondas
      ctx.strokeStyle = 'rgba(190,200,255,.22)'; ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        const y = wy + 22 + i * 24;
        ctx.beginPath();
        for (let x = -20; x <= VW + 20; x += 20)
          ctx.lineTo(x, y + Math.sin(x * .05 + SC.t * 1.4 + i) * 3);
        ctx.stroke();
      }
      // reflejo de luna
      for (let i = 0; i < 7; i++) {
        ctx.globalAlpha = .16 - i * .016;
        ctx.fillStyle = '#fff4d4';
        ctx.beginPath();
        ctx.ellipse(VW * .78 + Math.sin(SC.t * 1.6 + i) * 6, wy + 16 + i * 17,
                    17 - i * 1.2, 2.6, 0, 0, 7);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      // ondas de captura
      ripples.forEach(r => {
        ctx.globalAlpha = r.a; ctx.strokeStyle = '#ffe9a8'; ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
      });
      // estrellas cayendo
      stars.forEach(s => {
        ctx.save();
        if (s.got) {
          ctx.globalAlpha = 1 - s.got;
          ctx.translate(lerp(s.x, boat.x, s.got), lerp(s.y, boat.y - 30, s.got));
          ctx.scale(1 - s.got * .5, 1 - s.got * .5);
        } else {
          ctx.translate(s.x, s.y); ctx.rotate(s.sp * .25);
        }
        const gg = ctx.createRadialGradient(0, 0, 1, 0, 0, s.r * 3);
        gg.addColorStop(0, s.heart ? 'rgba(255,170,190,.6)' : 'rgba(255,232,150,.55)');
        gg.addColorStop(1, 'rgba(255,232,150,0)');
        ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, 0, s.r * 3, 0, 7); ctx.fill();
        if (s.heart) { heart(0, 0, s.r); ink('#ff9db4', 2.6); }
        else { star(0, 0, s.r, 5, .45); ink('#ffe89a', 2.6); }
        ctx.restore();
      });
      // barca
      boatShape(boat.x, boat.y);
      her.draw();
      // contador
      ctx.font = '700 16px Quicksand, sans-serif';
      ctx.fillStyle = 'rgba(255,238,180,.9)';
      ctx.textAlign = 'center';
      ctx.fillText('✦ ' + caught, VW / 2, 42);
      ctx.textAlign = 'left';
    }
  };
  function boatShape(x, y) {
    const bob = Math.sin(SC.t * 2.2) * 2.5;
    ctx.save(); ctx.translate(x, y + bob);
    ctx.beginPath();
    ctx.moveTo(-44, -6); ctx.lineTo(44, -6);
    ctx.quadraticCurveTo(34, 20, 0, 22); ctx.quadraticCurveTo(-34, 20, -44, -6);
    ctx.closePath(); ink('#b5714a', 3.4);
    ctx.beginPath(); ctx.moveTo(-40, -2); ctx.lineTo(40, -2);
    ctx.strokeStyle = '#8b5030'; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
  }
})();

/* ==========================================================================
   MUNDO 4 — LA CIUDAD QUE FLOTA  (control: Tito)
   ========================================================================== */
SC.list.city = (() => {
  let plats, him, cur, jumping, jt, from, to, camY, ph, glow;
  return {
    enter() {
      plats = [];
      const n = 7;
      for (let i = 0; i < n; i++) {
        plats.push({
          x: i === 0 ? VW * .5 : (i % 2 ? VW * .28 : VW * .72) + (Math.random() - .5) * 40,
          y: VH * .82 - i * 118,
          w: 78 - i * 3, ph: Math.random() * 6
        });
      }
      cur = 0; jumping = false; jt = 0; camY = 0; ph = 0; glow = 0;
      him = mkWalker('him', plats[0].x, plats[0].y, 84);
      him.dir = 1;
      AUDIO.setMode('city');
      setProgress(3);
      hint('ahora sos vos · tocá la plataforma de arriba', 5200);
    },
    down(x, y) {
      if (jumping || ph > 0 || cur >= plats.length - 1) return;
      const nx = plats[cur + 1];
      if (dist(x, y + camY, nx.x, nx.y) < 92) {
        jumping = true; jt = 0;
        from = { x: him.x, y: him.y };
        to = { x: nx.x, y: nx.y };
        him.dir = nx.x > him.x ? 1 : -1;
        him.setPose('jump');
        AUDIO.fx('jump');
      }
    },
    dbg() { return { cur, plats, camY, jumping, ph }; },
    update(dt) {
      if (jumping) {
        jt += dt * 1.6;
        const t = Math.min(1, jt);
        him.x = lerp(from.x, to.x, t);
        him.y = lerp(from.y, to.y, t) - Math.sin(t * Math.PI) * 74;
        if (t >= 1) {
          jumping = false; cur++; him.setPose('idle'); AUDIO.fx('land');
          if (cur >= plats.length - 1) {
            ph = 1; hideHint();
            setTimeout(() => { him.setPose('reach'); AUDIO.fx('chime'); }, 700);
            setTimeout(() => { setProgress(4); go('bridge'); }, 3000);
          }
        }
      }
      const targetCam = clamp(him.y - VH * .62, -1e9, 0);
      camY = lerp(camY, targetCam, Math.min(1, dt * 3));
      if (ph === 1) glow = Math.min(1, glow + dt * .5);
      him.update(dt);
    },
    draw() {
      skyGrad(['#2b1e4d', '#4b2f63', '#8b4a6b', '#d97e6a']);
      ctx.save();
      ctx.translate(0, -camY);
      // edificios flotantes de fondo
      for (let i = 0; i < 16; i++) {
        const x = rnd(i * 3.3, VW), y = VH * .9 - i * 96 - rnd(i * 5.5, 60);
        const w = 26 + rnd(i * 7.7, 40), h = 60 + rnd(i * 2.9, 90);
        ctx.globalAlpha = .42;
        ctx.beginPath(); rr(x - w / 2, y - h, w, h, 6);
        ink('#2a1b40', 2.4, 'rgba(18,10,32,.7)');
        ctx.fillStyle = 'rgba(255,214,150,.5)';
        for (let k = 0; k < 4; k++)
          for (let j = 0; j < 2; j++)
            if (rnd(i * 11 + k * 3 + j) > .45)
              ctx.fillRect(x - w / 2 + 8 + j * (w * .42), y - h + 12 + k * (h * .21), 7, 9);
        ctx.globalAlpha = 1;
      }
      // luz del bosque de ella, a lo lejos
      if (ph === 1) {
        const lx = VW * .18, ly = plats[plats.length - 1].y - 120;
        const g = ctx.createRadialGradient(lx, ly, 4, lx, ly, 110);
        g.addColorStop(0, `rgba(255,236,170,${.8 * glow})`);
        g.addColorStop(1, 'rgba(255,236,170,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(lx, ly, 110, 0, 7); ctx.fill();
        ctx.globalAlpha = glow;
        drawChar(ctx, 'her', 'reach', lx, ly + 34, 46, 1, glow * .95);
        ctx.globalAlpha = 1;
      }
      // plataformas
      plats.forEach((p, i) => {
        const bob = Math.sin(SC.t * 1.6 + p.ph) * 4;
        const next = (i === cur + 1 && !jumping && ph === 0);
        ctx.save(); ctx.translate(0, bob);
        if (next) {
          const g = ctx.createRadialGradient(p.x, p.y, 4, p.x, p.y, 70);
          g.addColorStop(0, `rgba(255,236,170,${.28 + Math.sin(SC.t * 4) * .12})`);
          g.addColorStop(1, 'rgba(255,236,170,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, 70, 0, 7); ctx.fill();
        }
        ctx.beginPath(); rr(p.x - p.w / 2, p.y, p.w, 20, 8);
        ink(i <= cur ? '#f0d5a8' : '#cbb28d', 3.4);
        ctx.beginPath(); rr(p.x - p.w / 2 + 6, p.y + 20, p.w - 12, 10, 5);
        ink('#a3814f', 3);
        ctx.restore();
      });
      him.draw();
      ctx.restore();
    }
  };
})();

/* ==========================================================================
   MUNDO 5 — EL PUENTE
   ========================================================================== */
SC.list.bridge = (() => {
  let gap, her, him, ph, hold, released, hearts, cam, t2, bigHeart;
  return {
    enter() {
      gap = 1; ph = 0; hold = 0; released = []; hearts = []; cam = 0; t2 = 0; bigHeart = null;
      her = mkWalker('her', VW * .16, VH * .70, 96);
      him = mkWalker('him', VW * .84, VH * .70, 98);
      her.dir = 1; him.dir = -1;
      AUDIO.setMode('bridge');
      setProgress(4);
      hint('mantené el dedo apoyado', 5000);
    },
    dbg() { return { gap, ph }; },
    update(dt) {
      t2 += dt;
      if (ph === 0) {
        if (IN.down) { hold += dt; gap = Math.max(0, gap - dt * .30); AUDIO.unlock(); }
        else hold = Math.max(0, hold - dt * .4);
        her.x = lerp(VW * .16, VW * .445, 1 - gap);
        him.x = lerp(VW * .84, VW * .555, 1 - gap);
        her.setPose(IN.down ? (Math.floor(t2 * 7) % 2 ? 'walk1' : 'walk2') : 'idle');
        him.setPose(IN.down ? (Math.floor(t2 * 7) % 2 ? 'walk2' : 'walk1') : 'idle');
        if (gap <= .02) {
          ph = 1; t2 = 0; hideHint();
          AUDIO.fx('heart');
          her.setPose('hold'); him.setPose('hold');
          // soltar las estrellas juntadas
          const n = Math.max(6, GAME.stars);
          for (let i = 0; i < n; i++)
            released.push({
              x: VW * .5 + (Math.random() - .5) * 60, y: VH * .62,
              vx: (Math.random() - .5) * 26, vy: -30 - Math.random() * 50,
              r: 5 + Math.random() * 6, sp: Math.random() * 6
            });
        }
      } else {
        if (t2 > 1.1 && hearts.length < 26 && Math.random() < dt * 12)
          hearts.push({ x: VW * .5 + (Math.random() - .5) * 90, y: VH * .60, vy: -22 - Math.random() * 26, s: 5 + Math.random() * 8, a: 1, rot: (Math.random() - .5) * .5 });
        cam = Math.min(1, cam + dt * .16);
        if (t2 > 1.5 && !bigHeart) bigHeart = { y: VH * .74 - 34, t: 0, s: 0 };
        if (bigHeart) {
          bigHeart.t += dt;
          bigHeart.s = Math.min(1, bigHeart.s + dt * 1.2);
          bigHeart.y -= dt * 22;
          bigHeart.a = bigHeart.t < .9 ? bigHeart.t / .9
                     : bigHeart.t > 2.4 ? Math.max(0, 1 - (bigHeart.t - 2.4) / 1.2) : 1;
        }
        if (t2 > 3.8) document.getElementById('end').classList.add('on');
      }
      released.forEach(s => { s.x += s.vx * dt; s.y += s.vy * dt; s.vy -= dt * 5; s.sp += dt * 2; });
      hearts.forEach(h => { h.y += h.vy * dt; h.a -= dt * .3; });
      hearts = hearts.filter(h => h.a > 0);
      her.update(dt); him.update(dt);
    },
    draw() {
      const k = ease(1 - gap);
      skyGrad([mix('#1a1638', '#2b2a63', k), mix('#2f2557', '#5b4a95', k),
               mix('#6b4472', '#a4739f', k), mix('#c67e73', '#f0b48e', k)]);
      // estrellas
      for (let i = 0; i < 80; i++) {
        const x = rnd(i * 3.1, VW), y = rnd(i * 6.7, VH * .62);
        ctx.globalAlpha = (.25 + .55 * Math.abs(Math.sin(SC.t * .7 + i))) * (1 - cam * .3);
        ctx.fillStyle = '#fff6e0'; ctx.fillRect(x, y, 1.6, 1.6);
      }
      ctx.globalAlpha = 1;
      // luna grande
      const my = VH * .18 - cam * 30;
      const gg = ctx.createRadialGradient(VW * .5, my, 10, VW * .5, my, 120);
      gg.addColorStop(0, 'rgba(255,244,214,.5)'); gg.addColorStop(1, 'rgba(255,244,214,0)');
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(VW * .5, my, 120, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(VW * .5, my, 40 + cam * 10, 0, 7); ink('#fdf3d6', 3.2);

      const gy = VH * .74;
      // el vacío entre los dos mundos
      const vg = ctx.createLinearGradient(0, gy - 10, 0, VH);
      vg.addColorStop(0, 'rgba(26,18,48,.55)');
      vg.addColorStop(.45, 'rgba(16,11,34,.95)');
      vg.addColorStop(1, '#0b0722');
      ctx.fillStyle = vg; ctx.fillRect(0, gy - 10, VW, VH - gy + 10);
      for (let i = 0; i < 5; i++) {
        ctx.globalAlpha = .1;
        puff(VW * .5 + Math.sin(SC.t * .3 + i * 2) * 60, gy + 40 + i * 34, 22 + i * 5, '#9f8fd0', 0);
        ctx.globalAlpha = 1;
      }
      // dos acantilados que se acercan
      const off = gap * VW * .22;
      [[-1, her.x], [1, him.x]].forEach(([s]) => {
        ctx.save();
        ctx.translate(s * off, 0);
        ctx.beginPath();
        const x0 = s < 0 ? -80 : VW * .5 + 14, x1 = s < 0 ? VW * .5 - 14 : VW + 80;
        ctx.moveTo(x0, gy);
        ctx.lineTo(x1, gy);
        ctx.lineTo(x1 - s * 16, VH + 40);
        ctx.lineTo(x0 - s * 16, VH + 40);
        ctx.closePath();
        ink('#7d5c86', 3.6);
        ctx.beginPath(); rr(x0, gy - 12, x1 - x0, 24, 10);
        ink(mix('#5f8f6a', '#8fc47f', k), 3.6);
        ctx.restore();
      });
      // puente de luz cuando se juntan
      if (gap < .35) {
        const a = (0.35 - gap) / .35;
        ctx.globalAlpha = a;
        const bg = ctx.createLinearGradient(VW * .35, 0, VW * .65, 0);
        bg.addColorStop(0, 'rgba(255,236,170,0)');
        bg.addColorStop(.5, 'rgba(255,236,170,.75)');
        bg.addColorStop(1, 'rgba(255,236,170,0)');
        ctx.fillStyle = bg;
        ctx.fillRect(VW * .3, gy - 10, VW * .4, 16);
        ctx.globalAlpha = 1;
      }
      // estrellas liberadas
      released.forEach(s => {
        ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.sp * .2);
        const g2 = ctx.createRadialGradient(0, 0, 1, 0, 0, s.r * 3);
        g2.addColorStop(0, 'rgba(255,236,160,.55)'); g2.addColorStop(1, 'rgba(255,236,160,0)');
        ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(0, 0, s.r * 3, 0, 7); ctx.fill();
        star(0, 0, s.r, 5, .45); ink('#ffe89a', 2.2);
        ctx.restore();
      });
      // corazones
      hearts.forEach(h => {
        ctx.save(); ctx.globalAlpha = h.a; ctx.translate(h.x, h.y); ctx.rotate(h.rot);
        heart(0, 0, h.s); ink('#ff9db4', 2); ctx.restore();
      });

      her.y = gy - 2; him.y = gy - 2;
      her.draw(); him.draw();
      if (bigHeart) {
        ctx.save();
        ctx.globalAlpha = (bigHeart.a || 0) * (1 - cam * .2);
        const s = 7 + bigHeart.s * 11;
        const gh = ctx.createRadialGradient(VW * .5, bigHeart.y, 2, VW * .5, bigHeart.y, s * 3.4);
        gh.addColorStop(0, 'rgba(255,160,190,.55)'); gh.addColorStop(1, 'rgba(255,160,190,0)');
        ctx.fillStyle = gh; ctx.beginPath(); ctx.arc(VW * .5, bigHeart.y, s * 3.4, 0, 7); ctx.fill();
        heart(VW * .5, bigHeart.y, s * (1 + Math.sin(SC.t * 3) * .05));
        ink('#ff8fab', 3);
        ctx.restore();
      }

      // barrita de "acercarse"
      if (ph === 0) {
        const bw = 150, bx = VW / 2 - bw / 2, by = VH - 34;
        ctx.beginPath(); rr(bx, by, bw, 10, 5);
        ctx.fillStyle = 'rgba(255,248,236,.2)'; ctx.fill();
        ctx.beginPath(); rr(bx, by, bw * (1 - gap), 10, 5);
        ctx.fillStyle = '#ffd98a'; ctx.fill();
      }
    }
  };
})();
